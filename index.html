<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IT Support Team</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <h1>Meet Your Connecticut IT Support Team</h1>
    <div class="school-selector">
      <label for="school-select">Select Your School:</label>
      <select id="school-select">
        <option value="">-- Choose a School --</option>
        <option value="BPMS">BPMS</option>
        <option value="BPES">BPES</option>
        <option value="AAES">AAES</option>
        <option value="AAMS">AAMS</option>
        <option value="AAHS">AAHS</option>
        <option value="ECES">ECES</option>
        <option value="ECMS">ECMS</option>
        <option value="HFES">HFES</option>
        <option value="HFMS">HFMS</option>
        <option value="HFHS">HFHS</option>
      </select>
    </div>
  </header>

  <!-- Associate Buttons Section -->
  <main>
    <div class="associate-buttons">
      <a href="heather.html" class="associate-btn" data-name="Heather Pascale">Heather Pascale</a>
      <a href="nick.html" class="associate-btn" data-name="Nick Chuzas">Nick Chuzas</a>
      <a href="benardo.html" class="associate-btn" data-name="Benardo Lora">Benardo Lora</a>
    </div>

    <!-- Ticket Submission Section -->
    <section class="ticket-section">
      <h2>Looking to submit a ticket?</h2>
      <p>Fill out this survey here to continue.</p>
      <a href="https://docs.google.com/forms/d/1f1rUNANH3RE-ViinHFcq7BWrb3mP76Rr3bfxkfZjIfo/edit" target="_blank" class="ticket-btn">Submit Ticket</a>
    </section>
  </main>

  <footer class="footer" style="text-align: center;">
    <img src="img/achievementfirst.png" alt="Achievement First Logo" style="max-width: 400px; margin-top: 30px;">
  </footer>

  <script>
  const schoolSelect = document.getElementById('school-select');
  const associateButtons = document.querySelectorAll('.associate-btn');
  
  schoolSelect.addEventListener('change', function() {
    const selectedSchool = this.value;

    // School assignments
    const heatherSchools = ["BPMS", "BPES", "ECES", "ECMS"];
    const nickSchools = ["AAES", "AAMS", "HFES", "HFHS", "HFMS"];
    const bothSchools = ["AAHS"];

    associateButtons.forEach(btn => {
      const name = btn.getAttribute('data-name');
      if (!selectedSchool) {
        btn.style.display = 'inline-block';
      } else if (heatherSchools.includes(selectedSchool)) {
        btn.style.display = (name === "Heather Pascale") ? 'inline-block' : 'none';
      } else if (nickSchools.includes(selectedSchool)) {
        btn.style.display = (name === "Nick Chuzas") ? 'inline-block' : 'none';
      } else if (bothSchools.includes(selectedSchool)) {
        btn.style.display = (name === "Heather Pascale" || name === "Nick Chuzas") ? 'inline-block' : 'none';
      } else {
        btn.style.display = 'none';
      }
    });
  });
  </script>
</body>
</html>
